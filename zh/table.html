<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>表浏览 · DP 道阶表</title>
  <meta name="description" content="浏览 DP 道阶表的 EASY / HARD 两套难度表，按曲名、md5、sha256 搜索，按大境与小阶筛选。">
  <meta name="theme-color" content="#100e0c">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-page="table" data-lang="zh" data-root="..">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">道</span>
        <span class="brand-text">DP 道阶表</span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="index.html">主页</a>
        <a href="table.html?t=easy" data-nav="easy">固元道途</a>
        <a href="table.html?t=hard" data-nav="hard">鋒殺剣途</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="table-hero">
      <div class="table-id">
        <span id="table-symbol" class="symbol" aria-hidden="true">♂◇</span>
        <div>
          <p class="eyebrow"><span id="mode-label">EASY CLEAR</span> · 2026-05-29 快照</p>
          <h1 id="table-name">固元道途</h1>
          <p class="name-sub" id="table-fullname">DP♂◇道階表 固元道途 (EASY CLEAR)</p>
          <div class="lang-switch" aria-label="语言 / Language">
            <span class="lang-active" aria-current="true">中文</span>
            <span class="sep">/</span>
            <a href="../table.html?t=easy" data-lang-link="en">English</a>
            <span class="sep">·</span>
            <span class="version">V0.2</span>
          </div>
        </div>
      </div>
      <div class="table-side">
        <div class="table-stats">
          <div class="stat"><b id="stat-total">—</b><span>谱面</span></div>
          <div class="stat"><b id="stat-sha">—</b><span>含 sha256</span></div>
          <div class="stat"><b id="stat-levels">56</b><span>阶</span></div>
        </div>
        <div class="switch" role="group" aria-label="切换表">
          <a id="switch-easy" href="table.html?t=easy">EASY</a>
          <a id="switch-hard" href="table.html?t=hard">HARD</a>
        </div>
      </div>
    </section>

    <section class="controls" aria-label="搜索与筛选">
      <label class="search">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.3"/>
          <path d="M12.6 12.6L17 17" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <input id="q" type="search" placeholder="搜索曲名 / md5 / sha256" autocomplete="off" spellcheck="false">
      </label>
      <select id="band" aria-label="按大境筛选">
        <option value="">全部七境</option>
        <option value="1">一 · 錬気</option>
        <option value="2">二 · 築基</option>
        <option value="3">三 · 結丹</option>
        <option value="4">四 · 元嬰</option>
        <option value="5">五 · 化神</option>
        <option value="6">六 · 錬虚</option>
        <option value="7">七 · 大乗</option>
      </select>
      <select id="level" aria-label="按小阶筛选">
        <option value="">全部阶</option>
      </select>
      <button id="reset" class="reset-btn" type="button">重置</button>
    </section>

    <div class="resultbar">
      <span>显示 <b id="shown-count">—</b> / <b id="total-count">—</b> 谱</span>
      <span class="legend"><i class="dot bucket"></i>疑 / 晦 = 待考阶 · 点哈希可复制</span>
    </div>

    <p id="loading" class="loading">正在载入谱面数据…</p>
    <section id="bands" class="bands" aria-live="polite"></section>

    <div id="empty" class="empty" hidden>
      <p>没有匹配的谱面。</p>
      <button id="empty-reset" class="reset-btn" type="button">清除筛选</button>
    </div>

    <div id="error" class="error" hidden></div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p>DP 道阶表 · 2026-05-29 快照</p>
      <p>非官方难度表，结果仅供参考。</p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="../assets/app.js"></script>
</body>
</html>
